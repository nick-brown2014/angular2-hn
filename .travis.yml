language: node_js
node_js:
  - "14"

dist: focal

addons:
  chrome: stable

branches:
  only:
    - master

before_script:
  - npm install -g firebase-tools

script:
  - npm run test:ci
  - npm run build

after_success:
  - |
    if [ "$TRAVIS_PULL_REQUEST" = "false" ]; then
      firebase use default
      firebase deploy --token $FIREBASE_TOKEN
    fi

notifications:
  email:
    on_failure: change
    on_success: change
